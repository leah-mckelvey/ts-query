[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-query-py"
version = "0.1.0"
description = "asyncio port of the @ts-query/core tiered query client, wire-compatible with the TypeScript core"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
redis = ["redis>=4.2"]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["ts_query*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
