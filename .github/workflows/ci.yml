name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x

      - name: Install dependencies
        run: |
          npm install
          npm install --force --no-save @rollup/rollup-linux-x64-gnu

      - name: Run full check (format, lint, build, tests+coverage)
        run: npm run check

  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # test_wire_compat.py runs the TypeScript serialization expressions
      # through node and compares them against the Python ones.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x

      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: packages/py-core

      - name: Run tests
        run: pytest -q
        working-directory: packages/py-core
